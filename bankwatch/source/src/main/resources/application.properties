spring.application.name=bankwatch
server.port=${PORT:8080}

# DB 이름은 bankwatch_db, 업무 스키마는 bankwatch다. 비밀번호는 로컬 환경에서 받는다.
spring.datasource.url=${BANKWATCH_DB_URL:jdbc:postgresql://localhost:5432/bankwatch_db}
spring.datasource.username=${BANKWATCH_DB_USER:bankwatch_app}
spring.datasource.password=${BANKWATCH_DB_PASSWORD}
spring.datasource.hikari.schema=bankwatch
spring.datasource.hikari.connection-init-sql=SET TIME ZONE 'Asia/Seoul'
spring.datasource.hikari.maximum-pool-size=8

# 스키마·시드·권한은 db/ 원본으로 먼저 적용한다. 앱 기동 시 SQL을 실행하지 않는다.
spring.sql.init.mode=never

# 2MB는 Spring DataSize 기준 2 MiB다. 요청 전체에는 multipart 부가 정보가 포함된다.
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=3MB
spring.servlet.encoding.charset=UTF-8
spring.servlet.encoding.enabled=true
spring.servlet.encoding.force=true

server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
spring.web.error.include-message=never
spring.web.error.include-stacktrace=never
spring.thymeleaf.cache=false
