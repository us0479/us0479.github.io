name: Real PostgreSQL integration

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BANKWATCH_CI_POSTGRES_IMAGE: postgres:16.16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: pom.xml

      # 고정 비밀번호·저장소 Secrets 없이 이 실행의 임시 DB 자격 증명만 생성한다.
      - name: Prepare isolated PostgreSQL and roles
        id: prepare_postgres
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          bankwatch_container="bankwatch-ci-postgres-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          bankwatch_env_file="${RUNNER_TEMP}/${bankwatch_container}.env"
          printf 'BANKWATCH_CI_CONTAINER=%s\nBANKWATCH_CI_ENV_FILE=%s\n' "$bankwatch_container" "$bankwatch_env_file" >> "$GITHUB_ENV"
          bankwatch_admin_password="$(openssl rand -hex 24)"
          BANKWATCH_TEST_OWNER_PASSWORD="$(openssl rand -hex 24)"
          BANKWATCH_TEST_APP_PASSWORD="$(openssl rand -hex 24)"
          BANKWATCH_TEST_VERIFIER_PASSWORD="$(openssl rand -hex 24)"
          export BANKWATCH_TEST_OWNER_PASSWORD BANKWATCH_TEST_APP_PASSWORD BANKWATCH_TEST_VERIFIER_PASSWORD
          for bankwatch_value in "$bankwatch_admin_password" "$BANKWATCH_TEST_OWNER_PASSWORD" "$BANKWATCH_TEST_APP_PASSWORD" "$BANKWATCH_TEST_VERIFIER_PASSWORD"; do
            printf '::add-mask::%s\n' "$bankwatch_value"
          done
          printf 'POSTGRES_DB=postgres\nPOSTGRES_USER=postgres\nPOSTGRES_PASSWORD=%s\nPOSTGRES_INITDB_ARGS=--auth-host=scram-sha-256\n' "$bankwatch_admin_password" > "$bankwatch_env_file"
          docker run --detach --name "$bankwatch_container" \
            --label "bankwatch.ci.run=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --env-file "$bankwatch_env_file" --publish 127.0.0.1::5432 \
            --tmpfs /var/lib/postgresql/data:rw \
            --health-cmd 'pg_isready -h 127.0.0.1 -U postgres -d postgres' \
            --health-interval 1s --health-timeout 3s --health-retries 60 \
            "$BANKWATCH_CI_POSTGRES_IMAGE"
          bankwatch_health="starting"
          for bankwatch_attempt in {1..60}; do
            bankwatch_health="$(docker inspect --format '{{.State.Health.Status}}' "$bankwatch_container")"
            if [[ "$bankwatch_health" == healthy ]]; then break; fi
            if [[ "$(docker inspect --format '{{.State.Running}}' "$bankwatch_container")" != true ]]; then
              docker logs "$bankwatch_container"
              exit 1
            fi
            printf 'Waiting for PostgreSQL (%s/60)\n' "$bankwatch_attempt"
            sleep 1
          done
          if [[ "$bankwatch_health" != healthy ]]; then
            docker logs "$bankwatch_container"
            exit 1
          fi
          docker exec -i --env BANKWATCH_TEST_OWNER_PASSWORD --env BANKWATCH_TEST_APP_PASSWORD \
            --env BANKWATCH_TEST_VERIFIER_PASSWORD "$bankwatch_container" \
            psql -X -v ON_ERROR_STOP=1 -U postgres -d postgres <<'SQL'
          \getenv owner_password BANKWATCH_TEST_OWNER_PASSWORD
          \getenv app_password BANKWATCH_TEST_APP_PASSWORD
          \getenv verifier_password BANKWATCH_TEST_VERIFIER_PASSWORD
          CREATE ROLE bankwatch_owner LOGIN PASSWORD :'owner_password';
          CREATE ROLE bankwatch_app LOGIN PASSWORD :'app_password';
          CREATE ROLE bankwatch_test_verifier LOGIN PASSWORD :'verifier_password';
          GRANT pg_signal_backend TO bankwatch_test_verifier;
          CREATE DATABASE bankwatch_test_ci OWNER bankwatch_owner;
          SQL
          bankwatch_address="$(docker port "$bankwatch_container" 5432/tcp)"
          bankwatch_port="${bankwatch_address##*:}"
          {
            printf 'BANKWATCH_TEST_DB_URL=jdbc:postgresql://127.0.0.1:%s/bankwatch_test_ci\n' "$bankwatch_port"
            printf 'BANKWATCH_TEST_OWNER_USER=bankwatch_owner\nBANKWATCH_TEST_OWNER_PASSWORD=%s\n' "$BANKWATCH_TEST_OWNER_PASSWORD"
            printf 'BANKWATCH_TEST_APP_PASSWORD=%s\n' "$BANKWATCH_TEST_APP_PASSWORD"
            printf 'BANKWATCH_TEST_VERIFIER_USER=bankwatch_test_verifier\nBANKWATCH_TEST_VERIFIER_PASSWORD=%s\n' "$BANKWATCH_TEST_VERIFIER_PASSWORD"
          } >> "$GITHUB_ENV"

      # 스키마·GRANT·시드는 전용 빈 DB에서 현재 JUnit이 직접 적용한다.
      - name: Run real PostgreSQL tests with Maven Wrapper
        id: run_postgres_tests
        shell: bash
        run: ./mvnw --batch-mode --no-transfer-progress -Ppostgres-it verify

      - name: Confirm tests executed without skips
        id: check_postgres_results
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          summary = ET.parse(Path('target/failsafe-reports/failsafe-summary.xml')).getroot()
          counts = {key: int(summary.findtext(key, default='0')) for key in ('completed', 'errors', 'failures', 'skipped', 'flakes')}
          if counts['completed'] == 0 or any(counts[key] for key in ('errors', 'failures', 'skipped', 'flakes')):
              raise SystemExit(f'PostgreSQL tests did not complete cleanly: {counts}')
          print(f'PostgreSQL JUnit: {counts}')
          PY

      - name: Preserve test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bankwatch-postgres-junit-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            target/failsafe-reports/
            target/surefire-reports/
          if-no-files-found: warn
          retention-days: 7

      - name: Remove isolated PostgreSQL
        id: cleanup_postgres
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${BANKWATCH_CI_CONTAINER:-}" ]] && docker container inspect "$BANKWATCH_CI_CONTAINER" > /dev/null 2>&1; then
            docker rm --force "$BANKWATCH_CI_CONTAINER"
          fi
          if [[ -n "${BANKWATCH_CI_ENV_FILE:-}" ]]; then
            rm -f -- "$BANKWATCH_CI_ENV_FILE"
          fi
